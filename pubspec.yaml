name: dd_glasses
description: AWAKE — 졸음 감지 및 피드백 보안경 컨트롤러 앱
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # BLE. 2.x 는 직원 15인 이상 조직에서 상용 라이선스가 필요합니다.
  # 대학 캡스톤은 해당되지 않지만, 상용화 계획이 있으면 확인이 필요합니다.
  flutter_blue_plus: ^2.1.0

  permission_handler: ^11.3.1
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.3
  vibration: ^2.0.0
  wakelock_plus: ^1.2.8
  intl: ^0.19.0
  share_plus: ^9.0.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
